  /tickets/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Maintenance]
      summary: Ticket thread
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
    patch:
      tags: [Maintenance]
      summary: Triage, assign, or change status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
                priority: { type: string }
                assigned_to: { type: string, format: uuid }
      responses:
        '200': { description: Updated }
  /work-orders:
    get:
      tags: [Maintenance]
      summary: List work orders
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
