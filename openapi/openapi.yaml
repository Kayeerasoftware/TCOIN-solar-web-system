        '200':
          description: Page of invoices
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Invoice' }
    post:
      tags: [Billing]
      summary: Create an invoice (manual or from a source record)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceCreate' }
      responses:
        '201':
          description: Draft invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
  /invoices/{id}:
    get:
      tags: [Billing]
      summary: Get an invoice
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
  /invoices/{id}/issue:
    post:
      tags: [Billing]
      summary: Issue the invoice (assigns the gapless number, submits e-invoice where required)
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { description: Issued }
        '409': { $ref: '#/components/responses/Conflict' }
  /invoices/{id}/pay:
    post:
      tags: [Billing]
      summary: Start an online payment (card or mobile money)
      description: Returns a hosted checkout URL or triggers a mobile money prompt. Final status arrives by webhook.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayRequest' }
      responses:
        '202':
          description: Payment initiated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments:
    get:
      tags: [Billing]
      summary: List confirmed payments
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Page of payments }
    post:
      tags: [Billing]
      summary: Record an offline payment (cash, bank transfer, cheque) and allocate it
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, method, amount, currency, allocations]
              properties:
                customer_id: { type: string, format: uuid }
                method: { type: string, enum: [cash, bank_transfer, cheque] }
                amount: { type: string }
                currency: { type: string }
                reference: { type: string }
                allocations:
                  type: array
                  items:
                    type: object
                    properties:
                      invoice_id: { type: string, format: uuid }
                      amount: { type: string }
      responses:
        '201': { description: Recorded; receipt generated }
  /payments/reconciliation:
    get:
      tags: [Billing]
      summary: Gateway settlement versus recorded payments for a date
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Matches and exceptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched: { type: integer }
                  exceptions:
                    type: array
                    items:
                      type: object
                      properties:
                        provider_ref: { type: string }
                        issue: { type: string, enum: [missing_in_system, missing_at_provider, amount_mismatch] }
  /payment-plans:
