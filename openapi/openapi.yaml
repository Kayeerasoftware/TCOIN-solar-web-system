                    type: object
                    properties:
                      variant_id: { type: string, format: uuid }
                      quantity: { type: number }
                      serial_no: { type: string }
                signature_document_id: { type: string, format: uuid }
      responses:
        '200': { description: Completed; stock decremented; billable lines flagged }
        '409': { $ref: '#/components/responses/Conflict' }
