            required: [quantity, description]
            properties:
              quantity: { type: number }
              item_no: { type: string }
              description: { type: string }
              condition: { type: string, enum: [new, good, used, damaged, faulty], default: new }
              variant_id: { type: string, format: uuid }
              serial_numbers: { type: array, items: { type: string } }
    DeliveryNote:
      allOf:
        - { $ref: '#/components/schemas/DeliveryNoteCreate' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            dn_no: { type: string }
            dn_date: { type: string, format: date }
            status: { type: string, enum: [draft, issued, delivered, cancelled] }
    DeliveryComplete:
      type: object
      required: [client_uuid, received_by_name, delivered_by_name]
      properties:
        client_uuid: { type: string, format: uuid }
        received_by_name: { type: string }
        received_signature_document_id: { type: string, format: uuid }
        delivered_by_name: { type: string }
        delivered_signature_document_id: { type: string, format: uuid }
        line_conditions:
          type: array
          items:
            type: object
            properties:
              line_no: { type: integer }
              condition: { type: string, enum: [new, good, used, damaged, faulty] }
    LetterCreate:
      type: object
      required: [addressee, body]
      properties:
        customer_id: { type: string, format: uuid }
        addressee: { type: string }
        your_ref: { type: string }
        subject: { type: string }
        body: { type: string, description: Rich text or markdown }
        template_code: { type: string, example: quotation_cover }
        signatory_id: { type: string, format: uuid }
    Letter:
      allOf:
        - { $ref: '#/components/schemas/LetterCreate' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            our_ref: { type: string, nullable: true, example: TCOIN/SOLAR/2026-001 }
            letter_date: { type: string, format: date }
            status: { type: string, enum: [draft, issued, void] }
