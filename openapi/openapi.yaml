              type: object
              required: [invoice_id, installments]
              properties:
                invoice_id: { type: string, format: uuid }
                installments:
                  type: array
                  items:
                    type: object
                    properties:
                      due_date: { type: string, format: date }
                      amount: { type: string }
      responses:
        '201': { description: Created }
  /credit-notes:
    post:
