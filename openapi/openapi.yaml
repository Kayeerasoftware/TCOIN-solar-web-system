  # ---------------------------------------------------------------- Webhooks (inbound)
  /webhooks/payments/{provider}:
    post:
      tags: [Webhooks]
      summary: Payment aggregator callback
      description: |
        Signature verified with the provider secret. The server re-queries the transaction from the provider,
        checks amount and currency, and only then records the payment and allocates it. Always returns 200 for
        valid, already-processed events so the provider stops retrying.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: X-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /webhooks/messaging/{provider}:
    post:
      tags: [Webhooks]
      summary: Delivery receipts and inbound WhatsApp or SMS messages
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Accepted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token (15 minutes). Browser clients may use the equivalent secure HTTP-only cookie.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
      description: Client-generated unique key. Repeats within 48 hours return the original response.
    IfMatch:
      name: If-Match
      in: header
      schema: { type: string }
      description: ETag from the last read. A mismatch returns 412.
  responses:
    Unauthorized:
      description: Missing, invalid, or expired credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found, or not visible to the caller
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict (stock, schedule overlap, already processed, invalid transition)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: ETag mismatch; re-read and retry
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Request body failed validation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable code
          example: insufficient_stock
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    Page:
      type: object
      properties:
        data: { type: array, items: {} }
        next_cursor: { type: string, nullable: true }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, example: '1250000.00' }
        currency: { type: string, minLength: 3, maxLength: 3, example: UGX }
    AuthResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, example: 900 }
        mfa_required: { type: boolean }
        mfa_token: { type: string, description: Present when mfa_required is true }
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        user_type: { type: string, enum: [staff, customer] }
        customer_id: { type: string, format: uuid, nullable: true }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    Customer:
      allOf:
        - { $ref: '#/components/schemas/CustomerCreate' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            customer_no: { type: string, example: CUS-2026-000045 }
            created_at: { type: string, format: date-time }
    CustomerCreate:
      type: object
      required: [customer_type, display_name]
      properties:
        customer_type: { type: string, enum: [individual, business, institution] }
        display_name: { type: string }
        legal_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        tax_id: { type: string }
        billing_address: { type: object, additionalProperties: true }
        preferred_currency: { type: string, default: UGX }
        marketing_consent: { type: boolean }
    LeadStatus:
      type: string
      enum: [new, contacted, survey_scheduled, quoted, negotiating, won, lost, spam]
    LeadCreate:
      type: object
      required: [full_name]
      properties:
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        location: { type: string }
        service_interest: { type: string, enum: [design, installation, maintenance, consultancy, components] }
        message: { type: string }
        source_code: { type: string, example: web_calculator }
        campaign: { type: string }
        calculator_input: { type: object, additionalProperties: true }
        calculator_result: { type: object, additionalProperties: true }
        consent_marketing: { type: boolean }
        captcha_token: { type: string, description: Required on public endpoints }
    Lead:
      allOf:
        - { $ref: '#/components/schemas/LeadCreate' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            lead_no: { type: string }
            status: { $ref: '#/components/schemas/LeadStatus' }
            assigned_to: { type: string, format: uuid, nullable: true }
            created_at: { type: string, format: date-time }
    Opportunity:
      type: object
      properties:
        id: { type: string, format: uuid }
        opp_no: { type: string }
        customer_id: { type: string, format: uuid }
        title: { type: string }
        service_line: { type: string }
        stage: { type: string, enum: [qualified, survey, design, quoted, negotiating, won, lost] }
        expected_value: { $ref: '#/components/schemas/Money' }
        probability: { type: integer, minimum: 0, maximum: 100 }
        owner_id: { type: string, format: uuid }
    ProductType:
      type: string
      enum: [panel, inverter, battery, charge_controller, mounting, cable, protection, accessory, service, labour]
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        product_type: { $ref: '#/components/schemas/ProductType' }
        brand: { type: string }
        model: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        specs:
          type: object
          additionalProperties: true
          description: 'Technical attributes, e.g. {"pmax_w":550,"voc":49.9,"isc":13.9}'
        warranty_months: { type: integer }
        is_serialised: { type: boolean }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }
    Variant:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
