      responses:
        '200': { description: Page of work orders }
    post:
      tags: [Maintenance]
      summary: Create a work order from a ticket or schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrder' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
  /work-orders/{id}/complete:
    post:
      tags: [Maintenance]
      summary: Complete with visit report, parts used, and customer signature
