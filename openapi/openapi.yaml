openapi: 3.0.3
info:
  title: TCOIN SOLAR UG Platform API
  version: 1.0.0
  description: |
    REST API for TCOIN SOLAR UG (TCOIN SOLAR UGANDA), the solar division of TCOIN UG (TCOIN Center of Innovations): design, installation, maintenance, consultancy, and component sales, including the TCOIN business documents (Proforma Invoice, Cash/Sales Receipt, Corporate Receipt, Payment Voucher, Delivery Note, Headed Letter).

    Conventions
    - Base path `/api/v1`, JSON bodies, UTC ISO-8601 timestamps, snake_case fields.
    - Cursor pagination: `limit` (max 100) and `cursor`; responses return `next_cursor`.
    - Errors use RFC 9457 problem details (`application/problem+json`) with a stable `code`.
    - `Idempotency-Key` is required on payment, order, and invoice creation; repeated keys return the original response.
    - `ETag` / `If-Match` protect quotes, designs, and projects from lost updates.
    - Money is a decimal string with a currency code, e.g. `{ "amount": "1250000.00", "currency": "UGX" }`.
  contact:
    name: Platform team
servers:
  - url: https://api.tcoinug.com/api/v1
    description: Production
  - url: https://api.staging.tcoinug.com/api/v1
    description: Staging
tags:
  - name: Auth
  - name: Public
  - name: CRM
  - name: Catalog
  - name: Sizing and design
  - name: Quotes
  - name: Orders
  - name: Inventory
  - name: Projects
  - name: Field sync
  - name: Maintenance
  - name: Consultancy
  - name: Billing
  - name: Platform
  - name: TCOIN documents
  - name: Webhooks
security:
  - bearerAuth: []
paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email or phone and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: Email or phone number }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200':
          description: Tokens, or an MFA challenge for staff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token and obtain a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      responses:
        '204': { description: Signed out }
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Send a one-time code to a customer's phone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '+256700000000' }
      responses:
        '202': { description: Code sent if the number is registered }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify a one-time code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, minLength: 4, maxLength: 8 }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Complete a staff MFA challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      tags: [Auth]
      summary: Current user, roles, and permissions
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
  # ---------------------------------------------------------------- Public
  /public/leads:
    post:
      tags: [Public]
      summary: Submit a lead from the website (bot protected, rate limited)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadCreate' }
      responses:
        '201':
          description: Lead created
          content:
            application/json:
              schema:
                type: object
                properties:
                  lead_no: { type: string, example: LD-2026-000123 }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /public/sizing/estimate:
    post:
      tags: [Public]
      summary: Indicative estimate for the public calculator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IndicativeRequest' }
      responses:
        '200':
          description: Ranges, not binding prices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndicativeResult' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /public/services:
    get:
      tags: [Public]
      summary: Service descriptions and consultation services
      security: []
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConsultationService' }
  # ---------------------------------------------------------------- CRM
  /customers:
    get:
      tags: [CRM]
      summary: List customers
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: q, in: query, schema: { type: string }, description: 'Search name, phone, or email' }
      responses:
        '200':
          description: Page of customers
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Customer' }
    post:
      tags: [CRM]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [CRM]
      summary: Customer 360 view
      responses:
        '200':
          description: Customer with summary counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [CRM]
      summary: Update a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
  /leads:
    get:
      tags: [CRM]
      summary: List leads
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LeadStatus' } }
        - { name: assigned_to, in: query, schema: { type: string }, description: User id or `me` }
        - { name: sort, in: query, schema: { type: string, example: '-created_at' } }
      responses:
        '200':
          description: Page of leads
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Lead' }
    post:
      tags: [CRM]
      summary: Create a lead (staff entry)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
  /leads/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [CRM]
      summary: Get a lead
      responses:
        '200':
          description: Lead
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [CRM]
      summary: Update status, assignment, or details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/LeadStatus' }
                lost_reason: { type: string }
                assigned_to: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
  /leads/{id}/convert:
    post:
      tags: [CRM]
      summary: Convert a lead into a customer and opportunity
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '201':
          description: Opportunity created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opportunity' }
  /opportunities:
    get:
      tags: [CRM]
      summary: List opportunities
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: stage, in: query, schema: { type: string } }
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Opportunity' }
  /activities:
    post:
      tags: [CRM]
      summary: Log a call, visit, note, or task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type, subject_id, activity_type, summary]
              properties:
                subject_type: { type: string, enum: [lead, opportunity, customer] }
                subject_id: { type: string, format: uuid }
                activity_type: { type: string, enum: [call, visit, note, task, email, whatsapp, meeting] }
                summary: { type: string }
                due_at: { type: string, format: date-time }
                assigned_to: { type: string, format: uuid }
      responses:
        '201': { description: Created }
  # ---------------------------------------------------------------- Catalog
  /catalog/products:
    get:
      tags: [Catalog]
      summary: Search and filter products
      security: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string }, description: Category slug }
        - { name: product_type, in: query, schema: { $ref: '#/components/schemas/ProductType' } }
        - { name: brand, in: query, schema: { type: string } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: in_stock, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Page of products
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Catalog]
      summary: Create a product (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Product' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
  /catalog/products/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Catalog]
      summary: Product with variants, specs, and datasheets
      security: []
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Catalog]
      summary: Update a product (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Product' }
      responses:
        '200': { description: Updated }
  /catalog/categories:
    get:
      tags: [Catalog]
      summary: Category tree
      security: []
      responses:
        '200':
          description: Tree
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /catalog/imports:
    post:
      tags: [Catalog]
      summary: Bulk import products or prices from CSV or XLSX
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                kind: { type: string, enum: [products, prices, stock] }
                dry_run: { type: boolean, default: true }
      responses:
        '202':
          description: Import job accepted; poll the job
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string, format: uuid }
  /price-lists:
    get:
      tags: [Catalog]
      summary: List price lists
      responses:
        '200':
          description: Price lists
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    code: { type: string }
                    name: { type: string }
                    currency: { type: string }
  # ---------------------------------------------------------------- Sizing and design
  /sizing/calculate:
    post:
      tags: [Sizing and design]
      summary: Full sizing calculation (engineer tool)
      description: Runs the sizing engine. Warnings are returned in the body; invalid input returns 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SizingRequest' }
      responses:
        '200':
          description: Design result with BOM and warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SizingResult' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /site-surveys:
    get:
      tags: [Sizing and design]
      summary: List site surveys
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Page of surveys }
    post:
      tags: [Sizing and design]
      summary: Create or submit a site survey (idempotent by client_uuid)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteSurvey' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteSurvey' }
  /designs:
    get:
      tags: [Sizing and design]
      summary: List system designs
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Page of designs }
    post:
      tags: [Sizing and design]
      summary: Create a design from survey, energy profile, and equipment choices
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignCreate' }
      responses:
        '201':
          description: Design stored with inputs, results, warnings, and engine version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Design' }
  /designs/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Sizing and design]
      summary: Get a design
      responses:
        '200':
          description: Design
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Design' }
    patch:
      tags: [Sizing and design]
      summary: Override values (reason required) or change status
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                overrides:
                  type: object
                  additionalProperties: true
                override_reason: { type: string }
                status: { type: string, enum: [draft, in_review, approved] }
      responses:
        '200': { description: Updated }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /designs/{id}/bom:
    get:
      tags: [Sizing and design]
      summary: Bill of materials mapped to catalog SKUs with price and availability
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: BOM
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BomItem' }
  # ---------------------------------------------------------------- Quotes
  /quotes:
    get:
      tags: [Quotes]
      summary: List quotes
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/QuoteStatus' } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Page of quotes
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Quote' }
    post:
      tags: [Quotes]
      summary: Create a quote, optionally from a design
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, currency]
              properties:
                customer_id: { type: string, format: uuid }
                opportunity_id: { type: string, format: uuid }
                design_id: { type: string, format: uuid }
                currency: { type: string, example: UGX }
                template: { type: string, example: home_hybrid }
      responses:
        '201':
          description: Draft quote with version 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
  /quotes/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Quotes]
      summary: Get a quote with the current version
      responses:
        '200':
          description: Quote
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '404': { $ref: '#/components/responses/NotFound' }
  /quotes/{id}/versions:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Quotes]
      summary: List versions
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuoteVersion' }
    post:
      tags: [Quotes]
      summary: Create a new version (copy of current, or supplied lines)
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteVersionInput' }
      responses:
        '201':
          description: New version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteVersion' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /quotes/{id}/submit-approval:
    post:
      tags: [Quotes]
      summary: Request approval when a discount exceeds the role limit
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '202': { description: Approval requested }
  /quotes/{id}/send:
    post:
      tags: [Quotes]
      summary: Freeze the current version, render the PDF, and send a secure link
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channels:
                  type: array
                  items: { type: string, enum: [email, sms, whatsapp] }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '409': { $ref: '#/components/responses/Conflict' }
  /quotes/{id}/accept:
    post:
      tags: [Quotes]
      summary: Customer accepts the quote
      description: |
        In one transaction: locks the quote, creates the deposit invoice, creates the project from the
        template, and reserves BOM stock. Events are written to the outbox.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepted_by_name, version_no]
              properties:
                accepted_by_name: { type: string }
                version_no: { type: integer }
                signature_document_id: { type: string, format: uuid }
      responses:
        '200':
          description: Accepted, with the deposit invoice and project ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote: { $ref: '#/components/schemas/Quote' }
                  deposit_invoice_id: { type: string, format: uuid }
                  project_id: { type: string, format: uuid }
        '409': { $ref: '#/components/responses/Conflict' }
  /quotes/{id}/pdf:
    get:
      tags: [Quotes]
      summary: Download the PDF of a version
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: version, in: query, schema: { type: integer } }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  # ---------------------------------------------------------------- Orders
  /cart:
    get:
      tags: [Orders]
      summary: Current cart
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
    put:
      tags: [Orders]
      summary: Replace cart items
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [variant_id, quantity]
                    properties:
                      variant_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
    post:
      tags: [Orders]
      summary: Place an order from the cart (checkout)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery_method]
              properties:
                delivery_method: { type: string, enum: [delivery, pickup] }
                shipping_address: { type: object, additionalProperties: true }
                contact: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Order and invoice created; pay via the invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: Insufficient stock
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Order with shipments
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an unshipped order
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { description: Cancelled }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}/shipments:
    post:
      tags: [Orders]
      summary: Create a shipment (fulfilment)
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                carrier: { type: string }
                tracking_no: { type: string }
      responses:
        '201': { description: Shipment created }
  /returns:
    post:
      tags: [Orders]
      summary: Request a return
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_line_id, quantity, reason]
              properties:
                order_line_id: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1 }
                reason: { type: string }
      responses:
        '201': { description: Return requested }
  # ---------------------------------------------------------------- Inventory
  /warehouses:
    get:
      tags: [Inventory]
      summary: List warehouses and vehicle stores
      responses:
        '200': { description: Warehouses }
  /stock:
    get:
      tags: [Inventory]
      summary: Stock by variant and location with reserved and available
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: warehouse_id, in: query, schema: { type: string, format: uuid } }
        - { name: low_stock, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Stock levels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockLevel' }
  /stock/movements:
    get:
      tags: [Inventory]
      summary: Ledger of movements
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: variant_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Page of movements }
    post:
      tags: [Inventory]
      summary: Post a stock movement (issue, adjustment, return)
      description: Append-only. Corrections are new movements. Adjustments require `inventory.approve_adjustment`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockMovementCreate' }
      responses:
        '201': { description: Posted }
        '409': { $ref: '#/components/responses/Conflict' }
  /stock/transfers:
    post:
      tags: [Inventory]
      summary: Transfer between locations (creates paired movements)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant_id, from_warehouse_id, to_warehouse_id, quantity]
              properties:
                variant_id: { type: string, format: uuid }
                from_warehouse_id: { type: string, format: uuid }
                to_warehouse_id: { type: string, format: uuid }
                quantity: { type: number }
                serial_numbers: { type: array, items: { type: string } }
      responses:
        '201': { description: Transferred }
  /serial-units/{serial}:
    get:
      tags: [Inventory]
      summary: Look up a serial number with its status, asset, customer, and warranty
      parameters:
        - { name: serial, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Serial unit }
        '404': { $ref: '#/components/responses/NotFound' }
  /suppliers:
    get:
      tags: [Inventory]
      summary: List suppliers
      responses:
        '200': { description: Suppliers }
  /purchase-orders:
    get:
      tags: [Inventory]
      summary: List purchase orders
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: Page of purchase orders }
    post:
      tags: [Inventory]
      summary: Create a purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderCreate' }
      responses:
        '201': { description: Created }
  /purchase-orders/{id}/approve:
    post:
      tags: [Inventory]
      summary: Approve a PO (approver must differ from creator)
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { description: Approved }
        '403': { $ref: '#/components/responses/Forbidden' }
  /purchase-orders/{id}/receive:
    post:
      tags: [Inventory]
      summary: Receive goods against a PO with serial numbers and landed cost
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouse_id, lines]
              properties:
                warehouse_id: { type: string, format: uuid }
                delivery_note_no: { type: string }
                freight_cost: { type: number }
                duty_cost: { type: number }
                lines:
                  type: array
                  items:
                    type: object
                    required: [po_line_id, quantity]
                    properties:
                      po_line_id: { type: string, format: uuid }
                      quantity: { type: number }
                      serial_numbers: { type: array, items: { type: string } }
      responses:
        '201': { description: 'Goods receipt created, stock updated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  # ---------------------------------------------------------------- Projects
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string } }
        - { name: manager_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Page of projects
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Project' }
  /projects/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Projects]
      summary: Project dashboard data (progress, budget, margin, milestones)
      responses:
        '200':
          description: Project
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
    patch:
      tags: [Projects]
      summary: Update status, dates, or manager
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Project' }
      responses:
        '200': { description: Updated }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /projects/{id}/milestones:
    get:
      tags: [Projects]
      summary: Milestones
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Milestones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Milestone' }
  /projects/{id}/tasks:
    get:
      tags: [Projects]
      summary: Tasks
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
    post:
      tags: [Projects]
      summary: Create a task
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Task' }
      responses:
        '201': { description: Created }
  /projects/{id}/commissioning:
    put:
      tags: [Projects]
      summary: Record commissioning readings and sign-off
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Commissioning' }
      responses:
        '200': { description: Saved }
        '422': { $ref: '#/components/responses/ValidationError' }
  /projects/{id}/handover:
    post:
      tags: [Projects]
      summary: Generate the handover pack and create assets and warranties
      description: Requires commissioning sign-off and all mandatory checklist items passed.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '201':
          description: Handover pack document and created assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  handover_document_id: { type: string, format: uuid }
                  asset_ids: { type: array, items: { type: string, format: uuid } }
        '409': { $ref: '#/components/responses/Conflict' }
  /schedule:
    get:
      tags: [Projects]
      summary: Calendar of crew assignments
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: crew_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Assignments }
    post:
      tags: [Projects]
      summary: Assign a crew to a project or task (rejects overlaps)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, crew_id, starts_at, ends_at]
              properties:
                project_id: { type: string, format: uuid }
                crew_id: { type: string, format: uuid }
                task_id: { type: string, format: uuid }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
      responses:
        '201': { description: Assigned }
        '409': { $ref: '#/components/responses/Conflict' }
  # ---------------------------------------------------------------- Field sync
  /sync/pull:
    get:
      tags: [Field sync]
      summary: Pull records changed since a cursor (technician PWA)
      description: Returns jobs, tasks, checklists, reference data, and tombstones assigned to the caller.
      parameters:
        - { name: cursor, in: query, schema: { type: integer, format: int64, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 1000 } }
        - { name: device_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPull' }
  /sync/push:
    post:
      tags: [Field sync]
      summary: Push queued mutations (idempotent by client_uuid)
      description: |
        Conflict rules: server wins for status and assignment; notes, photos, readings, and parts used are
        append-only and merged. Each mutation returns `applied`, `duplicate`, or `rejected` with a reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPush' }
      responses:
        '200':
          description: Per-mutation results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResult' }
  /uploads/sign:
    post:
      tags: [Field sync]
      summary: Get a signed URL to upload a file directly to object storage (resumable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_type, owner_id, doc_type, mime_type, size_bytes]
              properties:
                owner_type: { type: string }
                owner_id: { type: string, format: uuid }
                doc_type: { type: string }
                mime_type: { type: string }
                size_bytes: { type: integer }
                checksum_sha256: { type: string }
                taken_at: { type: string, format: date-time }
                lat: { type: number }
                lng: { type: number }
      responses:
        '200':
          description: Signed upload target
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_id: { type: string, format: uuid }
                  upload_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
  # ---------------------------------------------------------------- Maintenance
